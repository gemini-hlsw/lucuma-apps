<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Explore</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0,user-scalable=0"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/images/favicon.png" />
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha512-fHwaWebuwA7NSF5Qg/af4UeDx9XqUpYpOGgubo3yWu+b2IQR4UeQwbb42Ti7gVAjNtVoI/I9TEoYeu9omwcC6g=="
      crossorigin="anonymous"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
  </head>
  <script>
    // Workaround for https://github.com/Hacker0x01/react-datepicker/issues/2536
    if (global === undefined) {
      var global = window;
    }
  </script>

  <body>
    <script>
      // Applies the stored theme before first paint; Theme.init reads these classes back
      try {
        var theme = localStorage.getItem('lucuma-theme') || 'dark';
        var light =
          theme === 'light' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.body.classList.add(light ? 'light-theme' : 'dark-theme');
        if (theme === 'system') document.body.classList.add('system-theme');
      } catch (e) {}
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
