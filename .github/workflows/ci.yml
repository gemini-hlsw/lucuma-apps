name: Continuous Integration

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
  push:
    branches: ['**', '!update/**', '!pr/**']

permissions:
  actions: write
  checks: write
  contents: read
  deployments: write
  id-token: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3]
        java: [temurin@25]
        project: [rootJS, rootJVM]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g +update

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Configure FontAwesome registry auth
        run: 'pnpm config set "//npm.fontawesome.com/:_authToken" "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"'

      - name: Populate pnpm store
        run: pnpm fetch

      - name: pnpm install
        run: pnpm ci --offline

      - name: Check that workflows are up to date
        run: sbt -v -J-Xmx6g githubWorkflowCheck

      - name: Check headers and formatting
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-22.04'
        run: sbt -v -J-Xmx6g 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' headerCheckAll scalafmtCheckAll 'project /' scalafmtSbtCheck lucumaScalafmtCheck lucumaScalafixCheck lucumaSlackNotifyCheck

      - name: Check scalafix lints
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-22.04'
        run: sbt -v -J-Xmx6g 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' 'scalafixAll --check'

      - name: scalaJSLink
        if: matrix.project == 'rootJS'
        run: sbt -v -J-Xmx6g 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' Test/scalaJSLinkerResult

      - name: Test affected projects
        run: sbt -v -J-Xmx6g 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' lucumaTestAffected

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g +update

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Configure FontAwesome registry auth
        run: 'pnpm config set "//npm.fontawesome.com/:_authToken" "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"'

      - name: NPM Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: sbt -v -J-Xmx6g ui_css/npmPublish

  validate-steward:
    name: Validate Steward Config
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (fast)
        uses: actions/checkout@v6

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: coursier/setup-action@v1
        with:
          apps: scala-steward

      - run: scala-steward validate-repo-config .scala-steward.conf

  explore-deploy:
    name: Build and deploy Explore
    needs: [affected]
    if: (((github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && startsWith(github.repository, 'gemini'))) && (contains(fromJSON(needs.affected.outputs.projects), 'explore_app') || contains(fromJSON(needs.affected.outputs.projects), 'explore_workers'))
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g +update

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Configure FontAwesome registry auth
        run: 'pnpm config set "//npm.fontawesome.com/:_authToken" "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"'

      - name: Populate pnpm store
        run: pnpm fetch

      - name: pnpm install
        run: pnpm ci --offline

      - name: Link Explore
        run: sbt -v -J-Xmx6g explore_app/buildJsModule

      - name: Build Explore
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm explore build

      - name: override CI_COMMIT_SHA
        if: github.event_name == 'pull_request'
        run: echo "CI_COMMIT_SHA=${{ github.event.pull_request.head.sha}}" >> $GITHUB_ENV

      - name: Run BundleMon
        uses: lironer/bundlemon-action@v1
        with:
          bundlemon-args: '--config explore/.bundlemonrc.json --subProject "Explore"'

      - name: Deploy staging app to Firebase
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXPLORE_GEMINI }}
          entryPoint: ./explore
          projectId: explore-gemini
          target: dev
          channelId: live

      - name: Record deployment SHA
        if: github.ref == 'refs/heads/main'
        run: |
          # Create a deployment record with commit SHA for tracking
          echo "Recording deployment: ${{ github.sha }} to explore-gemini-dev"
          curl -X POST https://api.github.com/repos/${{ github.repository }}/deployments -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d '{ "ref": "${{ github.sha }}", "environment": "development", "description": "Explore deployment to dev", "auto_merge": false, "required_contexts": [], "task": "deploy:Explore" }' 

  observe-deploy:
    name: Build and publish Observe Docker image / Deploy to Heroku
    needs: [affected]
    if: ((github.ref == 'refs/heads/main' && startsWith(github.repository, 'gemini'))) && (contains(fromJSON(needs.affected.outputs.projects), 'observe_deploy') || contains(fromJSON(needs.affected.outputs.projects), 'observe_web_client'))
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3.9.0]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g +update

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Configure FontAwesome registry auth
        run: 'pnpm config set "//npm.fontawesome.com/:_authToken" "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"'

      - name: Populate pnpm store
        run: pnpm fetch

      - name: pnpm install
        run: pnpm ci --offline

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login --username nlsoftware --password-stdin

      - name: Build and Publish Observe Docker image
        run: 'sbt -v -J-Xmx6g ''++ ${{ matrix.scala }}'' clean observe_deploy/docker:publish'

      - name: Deploy and release app in Heroku
        run: |
          pnpm install -g heroku
          heroku container:login
          docker tag noirlab/gpp-obs registry.heroku.com/${{ vars.HEROKU_APP_NAME_GN || 'observe-dev-gn' }}/web
          docker push registry.heroku.com/${{ vars.HEROKU_APP_NAME_GN || 'observe-dev-gn' }}/web
          heroku container:release web -a ${{ vars.HEROKU_APP_NAME_GN || 'observe-dev-gn' }} -v
          docker tag noirlab/gpp-obs registry.heroku.com/${{ vars.HEROKU_APP_NAME_GS || 'observe-dev-gs' }}/web
          docker push registry.heroku.com/${{ vars.HEROKU_APP_NAME_GS || 'observe-dev-gs' }}/web
          heroku container:release web -a ${{ vars.HEROKU_APP_NAME_GS || 'observe-dev-gs' }} -v

  navigate-deploy:
    name: Build and publish Navigate Docker image
    needs: [affected]
    if: ((github.ref == 'refs/heads/main' && startsWith(github.repository, 'gemini'))) && (contains(fromJSON(needs.affected.outputs.projects), 'navigate_deploy'))
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3.9.0]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g +update

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login --username nlsoftware --password-stdin

      - name: Build and Publish Navigate Docker image
        run: 'sbt -v -J-Xmx6g ''++ ${{ matrix.scala }}'' clean navigate_deploy/docker:publish'

  lint:
    name: Run linters
    if: ((github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && startsWith(github.repository, 'gemini'))
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3.9.0]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g +update

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Configure FontAwesome registry auth
        run: 'pnpm config set "//npm.fontawesome.com/:_authToken" "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"'

      - name: Populate pnpm store
        run: pnpm fetch

      - name: pnpm install
        run: pnpm ci --offline

      - name: Import CSS files
        run: sbt -v -J-Xmx6g '++ ${{ matrix.scala }}' ui_css/lucumaCss

      - name: Run linters
        run: |
          find ui/lib/src/main/resources/lucuma-css -maxdepth 1 -type f -exec sed -n -e '/^[[:space:]]*--.*;[[:space:]]*$/p' -e '/^[[:space:]]*--[^;]*$/,/;$/p' {} + >vars.css
          pnpm exec stylelint explore/common/src/main/webapp/sass
          pnpm exec stylelint observe/web/client/src/main/webapp/styles
          pnpm exec stylelint ui/lib/src/main/resources/lucuma-css
          rm vars.css
          find ui/lib/src/main/resources/lucuma-css -maxdepth 1 -type f -exec sed -n -e '/^[[:space:]]*--.*;[[:space:]]*$/p' -e '/^[[:space:]]*--[^;]*$/,/;$/p' {} + >vars.css
          pnpm exec stylelint explore/common/src/main/webapp/sass
          pnpm exec stylelint observe/web/client/src/main/webapp/styles
          pnpm exec stylelint ui/lib/src/main/resources/lucuma-css
          rm vars.css
          pnpm exec prettier --check .

  affected:
    name: Affected Projects
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [3]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    outputs:
      all: ${{ steps.report.outputs.all }}
      projects: ${{ steps.report.outputs.projects }}
    timeout-minutes: 20
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt -v -J-Xmx6g +update

      - name: Compute affected projects
        id: report
        env:
          LUCUMA_AFFECTED_PUSH_BASE: ${{ github.event.before }}
        run: sbt -v -J-Xmx6g lucumaAffectedReport

  required-checks:
    name: REQUIRED CHECKS FOR BRANCH PROTECTION - AGGREGATED
    needs: [build]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fail if a required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required job did not pass"
          exit 1

      - name: Report success
        run: echo "all of build passed or were skipped"
