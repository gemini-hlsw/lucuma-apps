# Publishes the npm package containing the graphql schema.
# Only runs on the main branch when `navigate.graphql` is changed.

name: Publish npm package

on:
  push:
    branches:
      - "main"
    paths:
      - "navigate/web/server/src/main/resources/navigate.graphql"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish Navigate NPM package for schema

    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          # No `cache: sbt`: only ci.yml writes the sbt cache. Next step still reads it.

      - name: Restore sbt cache (read-only, written by ci.yml)
        uses: actions/cache/restore@v6
        with:
          # Must be byte-for-byte what setup-java passes for `cache: sbt` on Linux, in this
          # order: the cache "version" is a hash of this list, and a different list never matches.
          path: |
            /home/runner/.ivy2/cache
            /home/runner/.sbt
            /home/runner/.cache/coursier
            !/home/runner/.sbt/*.lock
            !/home/runner/**/ivydata-*.properties
          key: setup-java-${{ runner.os }}-x64-sbt-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt', '.github/workflows/ci.yml') }}
          restore-keys: setup-java-${{ runner.os }}-x64-sbt-

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: NPM Publish
        run: sbt schemas_libJS/npmPublish
